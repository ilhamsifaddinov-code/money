<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Arial'; background: #f4f7f6; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; margin-top: 50px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 350px; }
        .item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .red { color: red; cursor: pointer; }
        input { width: 40%; padding: 8px; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h3>Maliye Baqlawshı</h3>
        <input type="text" id="name" placeholder="Zat ati">
        <input type="number" id="sum" placeholder="Summa">
        <button onclick="add()">Qosıw</button>
        <div id="list"></div>
        <h4 id="total">Jámi: 0 sım</h4>
    </div>
    <script>
        let total = 0;
        function add() {
            let name = document.getElementById('name').value;
            let sum = parseInt(document.getElementById('sum').value);
            if(name && sum) {
                total += sum;
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<span>${name}</span> <span>${sum} sım</span>`;
                document.getElementById('list').appendChild(div);
                document.getElementById('total').innerText = `Jámi: ${total} sım`;
            }
        }
    </script>
</body>
</html>
